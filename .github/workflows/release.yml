# Project:  Privatium™  |  File: .github/workflows/release.yml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-09-05  |  Modified: 2026-09-06
# Summary:  Build a tested release commit and attach the four release archives — one
#           single-binary archive per operating system and the Windows portable zip — when a
#           release is published, or on demand for a release tag that already exists.
#           See main README.md for full license information.

name: Release binaries

on:
  release:
    types: [published]
  # Attach binaries to a release that was published without them — one made before
  # this workflow existed, or one whose run failed — by naming its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the published release to build and attach binaries to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # A release published minutes after its merge finds push CI on that commit still
  # running; release_tools.py waits for it (CI_WAIT_SECONDS), so this timeout sits above.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Resolve the release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: python .github/scripts/release_tools.py check-ci "$RELEASE_SHA"

  build:
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build -p privatium --release --locked
      - name: Smoke test executable
        shell: bash
        run: |
          binary=target/release/privatium
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" skill list
      - name: Package the binary
        id: artifact
        run: python .github/scripts/release_tools.py package "${{ runner.os }}"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error
      # The Windows portable zip (spec/cli.md §1): one file per step with `archive: false`.
      - uses: actions/upload-artifact@v7
        if: steps.artifact.outputs.portable != ''
        with:
          path: ${{ steps.artifact.outputs.portable }}
          archive: false
          if-no-files-found: error

  attach:
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: privatium*
          merge-multiple: true
          skip-decompress: true
          path: dist
      # Every archive release_tools.py names must be here, or nothing is attached.
      - name: Attach the archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=""
          for name in $(python .github/scripts/release_tools.py assets list); do
            test -s "dist/$name" || { echo "missing archive: dist/$name"; exit 1; }
            assets="$assets dist/$name"
          done
          gh release upload "$RELEASE_TAG" $assets --clobber
